# Copy to /mnt/user/appdata/clearview/clearview.yaml (or wherever CONFIG_DIR points).
# Everything here is optional. Containers are discovered automatically.

# Browser tab title prefix.
title: tower

# Accent colour for headings, the selected row and highlights, as #rrggbb. Quote it: an unquoted #
# starts a yaml comment. Leave it out for the built-in orange.
# accent: "#3b82f6"

# Other devices on your network. `check` decides what the status dot means:
#   http  any HTTP response counts as up (default; self-signed certs are fine)
#   tcp   the port accepts a connection
#   none  no probe, just a link
links:
  - name: Router
    url: http://192.168.1.1
    group: network
    description: Gateway
  - name: UniFi Controller
    url: https://192.168.1.2:8443
    group: network
  - name: Proxmox
    url: https://192.168.1.20:8006
    group: compute
    check: tcp
  - name: Hue Bridge
    url: http://192.168.1.70
    group: devices
    check: none

# Categories: sections in the containers table, listed in this order. Each one is a list of
# container names; `*` is a wildcard (quote it, YAML reads a bare * as an alias). The first
# match wins. A clearview.group label on a container, or `group:` under overrides below, beats
# these lists. Containers that match nothing are listed under "other".
groups:
  Infrastructure: [grafana, prometheus, node-exporter, cadvisor, watchtower, "postgres*", mariadb, redis, clearview]
  Media: [plex, tautulli, overseerr, jellyfin]
  Downloads: ["*arr", qbittorrent, sabnzbd]
  Home: [home-assistant, esphome, zigbee2mqtt, mosquitto]

containers:
  # Hide by container name. A container can also opt out with the label clearview.hide=true
  hide:
    - watchtower
  # Override what discovery found, by container name.
  overrides:
    plex:
      name: Plex
      url: http://[IP]:32400/web
    # pihole:
    #   url: http://[IP]:8053/admin

# Only needed off Unraid or for custom mounts. By default every folder under /host/mnt
# (user, cache, disk1..n, pools) is shown.
# disks:
#   - name: array
#     path: /host/mnt/user
